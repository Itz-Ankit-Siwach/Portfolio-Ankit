<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#101525"/>
    </linearGradient>

    <!-- Accent Border Gradient (Electric Violet to Cyan) -->
    <linearGradient id="accent-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow Core Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="2.5"/>

  <!-- Neural Connection Synaptic Lines -->
  <path d="M 16 32 L 32 18 L 48 32 L 32 46 Z" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.45"/>
  <path d="M 32 18 L 32 46" stroke="#22D3EE" stroke-width="1.2" opacity="0.35"/>
  <path d="M 16 32 L 48 32" stroke="#22D3EE" stroke-width="1.2" opacity="0.35"/>

  <!-- Stylized Modern "A" & "S" AI Glyph -->
  <!-- "A" Glyph Left Wing -->
  <path d="M 23 44 L 32 20 L 41 44" stroke="url(#accent-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar with glowing node -->
  <path d="M 26.5 35.5 L 37.5 35.5" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "S" Flow Curve through the Center -->
  <path d="M 38 27 C 35 24 29 25 29 29 C 29 34 35 34 35 38 C 35 42 29 42 26 39" 
        stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Neural Nodes (Pulsing Synaptic Dots) -->
  <circle cx="32" cy="20" r="3" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="23" cy="44" r="2.5" fill="#8B5CF6"/>
  <circle cx="41" cy="44" r="2.5" fill="#22D3EE"/>
  <circle cx="16" cy="32" r="2" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="48" cy="32" r="2" fill="#22D3EE" opacity="0.8"/>
  <circle cx="32" cy="35.5" r="2" fill="#FFFFFF" filter="url(#glow)"/>
</svg>